<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#f3f5f4;font-family:system-ui,-apple-system,sans-serif;color:#1c2a33}
.wrap{padding:112px 64px 0}
h1{font-size:26px;font-weight:600;margin:0 0 28px}
.check{position:relative;background:#edf3f0;border:1px solid #cddbd4;border-radius:10px;padding:34px 36px 26px;display:grid;grid-template-columns:1fr auto;gap:10px 36px;overflow:hidden}
.check::before{content:"";position:absolute;inset:0;background-image:repeating-radial-gradient(circle at 12% 120%,transparent 0 7px,rgba(38,104,90,.085) 7px 8px),repeating-radial-gradient(circle at 92% -40%,transparent 0 9px,rgba(38,104,90,.085) 9px 10px)}
.check>*{position:relative}
.lines{font-family:"Source Serif 4",Georgia,serif;font-size:34px;line-height:1.6}
.lbl{color:#4c5a63;font-size:.62em;display:inline-block;width:9.5em}
.blank{border-bottom:1.5px solid #1c2a33;padding:0 6px}
.box{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:92px;line-height:1;border:1.5px solid #1c2a33;border-radius:5px;padding:16px 22px 12px;background:#fcfcfb;align-self:center}
.sub{grid-column:2;text-align:right;color:#4c5a63;font-size:18px;margin-top:-4px}
.memo{grid-column:1/-1;border-top:1px solid #cddbd4;padding-top:12px;margin-top:6px;font-size:17px;color:#4c5a63;display:flex;justify-content:space-between}
</style></head><body><div class="wrap">
<h1>When will countries enact a universal basic income?</h1>
<div class="check"><div class="lines">
<div><span class="lbl">Pay to the order of</span>every adult in <span class="blank">the United States</span></div>
<div><span class="lbl">The sum of</span><span class="blank">$6,000 a year</span></div>
<div><span class="lbl">Enacted by</span><span class="blank">2040</span></div></div>
<div class="box">9.6%</div><div class="sub">chance, as of September 2026</div>
<div class="memo"><span>Ten countries. Every assumption adjustable.</span><span>maxghenis.com/ubi-forecast</span></div></div>
</div></body></html>
